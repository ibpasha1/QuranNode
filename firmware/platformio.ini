; QuranNode ESP32-S3 firmware.
; Target rig: DSP-Mini DevKitC-1 + 3.5" ST7796S (the devkit_st7796s setup),
; reusing DSP-Mini's pin_config.h. Native 480x320 rendering.

[platformio]
src_dir = main
; Wi-Fi credentials live in secrets.ini (gitignored) so they never hit the repo.
extra_configs = secrets.ini

[env:devkit_st7796s]
; Pinned: 6.4.0 = ESP-IDF 5.1.1 (the monolithic `driver` component still has
; uart.h/i2s_std.h). Newer platforms split `driver`, which breaks the includes.
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -DDISPLAY_ST7796S
    -DDSPMINI_DEVKIT
    ; GitHub repo the device pulls firmware from: releases/latest/download/firmware.bin
    '-DOTA_REPO="ibpasha1/QuranNode"'
    ; Firmware version (CI overrides this with the git tag).
    '-DFW_VERSION="v0.6.7"'
    ; Wi-Fi creds come from secrets.ini (not committed) — see [secrets] there.
    ${secrets.wifi}
; Al-Fatihah is bundled in flash as C arrays (firmware/components/qn/drivers/
; embedded_assets.c, generated by tools/gen_embedded.py) so the reader + audio
; work on the bench without an SD card.
